spring.application.name=ticket-platform
spring.datasource.url=jdbc:postgresql://localhost:5432/ticketdb
spring.datasource.username=pratik
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

#spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

#spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

#HikariCP connection pool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.pool-name=Ticket Pool
spring.datasource.hikari.auto-commit=true

#JDBC fetch type
spring.jpa.properties.hibernate.jdbc.fetch_size=50

#connection pool and SQL behaviour
logging.level.com.zaxxer.hikari=debug
logging.level.org.hibernate.sql=debug

spring.data.web.pageable.max-page-size=50

